  <path d="M38 46 L48 26 M62 46 L52 26" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
  <!-- Connected nodes -->
  <circle cx="36" cy="58" r="4" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="50" cy="62" r="5" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="64" cy="58" r="4" fill="#22D3EE" filter="url(#glow)" />
  <line x1="36" y1="58" x2="50" y2="62" stroke="#06B6D4" stroke-width="2" opacity="0.8" />
  <line x1="50" y1="62" x2="64" y2="58" stroke="#8B5CF6" stroke-width="2" opacity="0.8" />
  <circle cx="50" cy="26" r="3.5" fill="#38BDF8" />
